services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devinsight
      POSTGRES_USER: devinsight
      POSTGRES_PASSWORD: devinsight
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://devinsight:devinsight@postgres:5432/devinsight
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the environment before starting Compose}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
      GITHUB_SCOPE: ${GITHUB_SCOPE:-read:user user:email repo}
      FRONTEND_URL: http://localhost:3000
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: ../backend
    command: celery -A app.queue.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://devinsight:devinsight@postgres:5432/devinsight
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the environment before starting Compose}
    depends_on: [postgres, redis]
  frontend:
    build: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
